name: gamepads_linux
description: Freegosy's patched copy of gamepads_linux 0.1.2 (see PATCHES.md).
version: 0.1.2
publish_to: none

flutter:
  plugin:
    implements: gamepads
    platforms:
      linux:
        pluginClass: GamepadsLinuxPlugin

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  gamepads_platform_interface: ^0.1.3
